[package]
name = "agentlang"
version = "0.1.0"
edition = "2021"
description = "The AgentLang compiler — a language designed for LLM-generated software"
license = "MIT"
repository = "https://github.com/solcacto/AgentLang"

[lib]
name = "agentlang"
path = "src/lib.rs"

[[bin]]
name = "agent"
path = "src/main.rs"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
opt-level = 3